<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Pré-inscrição • Solar Interativo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050814;
      --panel: rgba(8, 12, 22, 0.92);
      --gold: #ffb700;
      --orange: #ff8c28;
      --white: #f5f5f5;
      --muted: #c8c8d0;
      --border: rgba(255, 183, 0, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--white);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      background-image:
        radial-gradient(ellipse at 20% 10%, rgba(255, 140, 40, 0.2) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 90%, rgba(30, 80, 180, 0.18) 0%, transparent 50%);
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px 36px;
      backdrop-filter: blur(16px);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.5);
    }

    @media (max-width: 480px) {
      .card { padding: 32px 20px 28px; border-radius: 18px; }
    }

    .logo {
      text-align: center;
      margin-bottom: 10px;
    }
    .logo span {
      font-size: 12px;
      letter-spacing: 0.2em;
      color: var(--gold);
      font-weight: 600;
    }

    h1 {
      text-align: center;
      font-size: clamp(26px, 6vw, 32px);
      font-weight: 800;
      line-height: 1.15;
      margin: 8px 0 6px;
    }
    h1 em {
      font-style: normal;
      color: var(--gold);
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 14.5px;
      margin-bottom: 32px;
      line-height: 1.4;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 7px;
      color: var(--muted);
    }

    input {
      width: 100%;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 15px 16px;
      color: var(--white);
      font-size: 16px;
      font-family: inherit;
      margin-bottom: 20px;
      transition: border-color 0.2s, background 0.2s;
    }
    input:focus {
      outline: none;
      border-color: var(--gold);
      background: rgba(255, 183, 0, 0.09);
    }
    input::placeholder { color: #777; }

    button {
      width: 100%;
      background: linear-gradient(135deg, var(--orange), #ff6a00);
      color: #111;
      border: none;
      border-radius: 14px;
      padding: 17px;
      font-size: 16.5px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-top: 8px;
      transition: transform 0.15s, filter 0.15s;
    }
    button:hover { filter: brightness(1.1); transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.7; cursor: wait; }

    .note {
      text-align: center;
      font-size: 12.5px;
      color: #999;
      margin-top: 20px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><span>SOLAR INTERATIVO 360°</span></div>
    <h1>Pré-inscrição<br><em>Versão 1.0</em></h1>
    <p class="subtitle">Garanta seu acesso antecipado à experiência interativa do Sistema Solar.</p>

    <form id="preForm">
      <label for="nome">Seu nome</label>
      <input type="text" id="nome" name="nome" placeholder="Nome completo" required autocomplete="name" />

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="seu@email.com" required autocomplete="email" />

      <label for="telefone">Número (WhatsApp / celular)</label>
      <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required autocomplete="tel" />

      <button type="submit">Concluir pré-inscrição</button>
    </form>

    <p class="note">Após o envio você será redirecionado para a experiência Solar Interativo.</p>
  </div>

  <script>
    document.getElementById('preForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const btn = this.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'Redirecionando…';
      window.location.href = 'https://solarinterativo.grok.me';
    });
  </script>
</body>
</html>
